[global]
developmentMode = false

[server]
address = "127.0.0.1"
port = 8501
headless = true
maxUploadSize = 8
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#2258B8"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5FA"
textColor = "#152A45"
font = "sans serif"
