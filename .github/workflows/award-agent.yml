name: Validate public awards snapshot
on:
  push:
    paths: ['data/exports/public-data.json', 'data/exports/publication.json', 'AWARDS.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate locally reviewed data (no collection or write credentials)
        run: python scripts/validate_public_snapshot.py
